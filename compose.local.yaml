services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:8
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
